[install]
# 公開から 7 日未満の版は解決しない（推移的な依存も。供給網の攻撃と出たばかりの不具合を避ける。sdk.md §5.2）
minimumReleaseAge = 604800
# 依存の install スクリプト（postinstall など）を動かさない
ignoreScripts = true
# 各 package は自分の package.json に宣言した依存だけを解決する（pnpm と同じ isolated）。宣言していない import は動かない。
# Bun の既定は版と lockfile の configVersion で変わるので明示する。宣言漏れは kit check の構造検査も止める
linker = "isolated"
